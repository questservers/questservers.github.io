<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest Token Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(145deg, #1a1e2b 0%, #2a2f3f 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
      padding: 20px;
      margin: 0;
    }

    .card {
      background: rgba(18, 22, 33, 0.95);
      backdrop-filter: blur(12px);
      border-radius: 3rem 1rem 3rem 1rem;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.8), 0 0 0 2px #ffd966, 0 0 0 6px #2e1b3a;
      max-width: 780px;
      width: 100%;
      padding: 2rem 1.75rem 2.5rem;
      transition: all 0.2s;
      border: 1px solid #f0c45a;
      max-height: 92vh;
      overflow-y: auto;
    }

    /* scrollbar styling */
    .card::-webkit-scrollbar {
      width: 10px;
    }
    .card::-webkit-scrollbar-track {
      background: #0e121c;
      border-radius: 20px;
    }
    .card::-webkit-scrollbar-thumb {
      background: #f7c35c;
      border-radius: 20px;
      border: 2px solid #0e121c;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 1px;
      text-align: center;
      color: #fde16d;
      text-shadow: 4px 4px 0 #2b1d0e, 7px 7px 0 rgba(0, 0, 0, 0.3);
      margin-top: -0.5rem;
      margin-bottom: 0.5rem;
      transform: rotate(-1deg);
      word-break: break-word;
    }

    .subhead {
      text-align: center;
      color: #b7b7e2;
      font-style: italic;
      margin-bottom: 1.2rem;
      font-weight: 500;
      text-shadow: 0 2px 3px black;
      border-bottom: 2px dashed #6d5f3a;
      padding-bottom: 0.7rem;
      font-size: 1rem;
    }

    .progress-sticky {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #0e121c;
      padding: 0.6rem 1rem;
      border-radius: 40px 8px 40px 8px;
      border: 2px solid #f7c35c;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 6px 0 #2b1d0e;
    }

    .progress-text {
      color: #ffda7a;
      font-weight: 700;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .progress-bar-outer {
      flex: 1;
      height: 14px;
      background: #1a1a22;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #4a3f2c;
    }

    .progress-bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f7c35c, #ffd966);
      border-radius: 20px;
      transition: width 0.2s ease;
      box-shadow: 0 0 10px #f7c35c;
    }

    .progress-percent {
      color: #f7e05e;
      font-weight: 900;
      font-size: 0.9rem;
      min-width: 3.5rem;
      text-align: right;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.35rem 0.5rem;
      border-left: 3px solid transparent;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .field.missing {
      background: rgba(255, 60, 60, 0.08);
      border-left-color: #ff4d4d;
    }

    .field.done {
      border-left-color: #4dff88;
    }

    label {
      font-weight: 700;
      color: #ffda7a;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      letter-spacing: 0.2px;
      font-size: 0.98rem;
      text-shadow: 0 2px 2px black;
      line-height: 1.35;
    }

    .qnum {
      color: #8a7fb5;
      font-weight: 800;
      font-size: 0.82rem;
      min-width: 2rem;
      padding-top: 2px;
    }

    .req-star {
      color: #ff6b6b;
      font-size: 1.2rem;
      line-height: 0.5;
      filter: drop-shadow(0 0 5px #ff3b3b);
      font-weight: 900;
    }

    input, select, textarea {
      background: #0e121c;
      border: 2px solid #4a3f2c;
      border-radius: 40px 10px 40px 10px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      color: #f5e9d8;
      outline: none;
      transition: 0.15s;
      font-family: inherit;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.8), 0 0 0 1px #181818;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #f7c35c;
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.8), 0 0 0 3px rgba(247, 195, 92, 0.3);
      background: #121826;
    }

    input.invalid, select.invalid, textarea.invalid {
      border-color: #ff4d4d;
      background: #1f0e0e;
    }

    input::placeholder, textarea::placeholder {
      color: #6b6180;
      font-style: italic;
      font-size: 0.85rem;
    }

    .btn-generate {
      background: #f7c35c;
      border: none;
      border-bottom: 8px solid #b17d2a;
      color: #1d1305;
      font-weight: 900;
      font-size: 1.5rem;
      letter-spacing: 2px;
      padding: 0.9rem 1.5rem;
      margin-top: 1.5rem;
      border-radius: 50px 15px 50px 15px;
      cursor: pointer;
      text-transform: uppercase;
      transition: 0.1s linear;
      font-family: inherit;
      box-shadow: 0 10px 0 #2b1d0e, 0 8px 25px #f7c35c80;
      transform: translateY(-2px);
      width: 100%;
      position: sticky;
      bottom: 0;
    }

    .btn-generate:hover {
      background: #ffd97c;
      transform: translateY(0px);
      border-bottom-width: 6px;
      box-shadow: 0 7px 0 #2b1d0e, 0 8px 30px #ffd966;
    }

    .btn-generate:active {
      transform: translateY(5px);
      border-bottom-width: 2px;
      box-shadow: 0 2px 0 #2b1d0e;
    }

    .token-output {
      margin-top: 2rem;
      background: #0c0e14;
      border-radius: 20px 5px 20px 5px;
      padding: 1.5rem 1rem;
      text-align: center;
      border: 2px dashed #f7c35c;
      box-shadow: inset 0 0 25px #000000, 0 8px 0 #1e1a10;
      word-break: break-all;
    }

    .token-label {
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ab8e4e;
      font-weight: 300;
      margin-bottom: 10px;
    }

    .token-value {
      font-family: 'Courier New', 'Fira Code', monospace;
      font-size: 1rem;
      font-weight: 800;
      color: #f7e05e;
      text-shadow: 0 0 15px #ffbb00, 0 0 30px #ff9d00;
      letter-spacing: 1px;
      padding: 0.75rem 0.5rem;
      background: #1a1a22;
      border-radius: 12px 2px 12px 2px;
      border: 1px solid #67511f;
      word-break: break-all;
      line-height: 1.6;
      min-height: 5rem;
    }

    .token-value:empty::before {
      content: "✧ ✧ ✧ ✧ ✧ ✧ ✧ ✧";
      opacity: 0.5;
      font-weight: 300;
      color: #5f5f7a;
      letter-spacing: 6px;
      font-size: 1.4rem;
    }

    .small-note {
      font-size: 0.75rem;
      color: #a79b7a;
      text-align: right;
      margin-top: 1rem;
      opacity: 0.8;
      font-style: italic;
    }

    .glitch {
      animation: glitch 0.1s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 #ff0055, -2px 0 #00ccff; }
      100% { text-shadow: -2px 0 #ff0055, 2px 0 #00ccff; }
    }

    .section-divider {
      margin: 1.2rem 0 0.5rem;
      text-align: center;
      color: #f7c35c;
      font-weight: 900;
      font-size: 1.05rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: 0 2px 0 #2b1d0e;
      border-top: 2px dashed #5b4c32;
      border-bottom: 2px dashed #5b4c32;
      padding: 0.5rem;
      background: #12161f;
      border-radius: 30px 5px 30px 5px;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-140%);
      background: #ff4d4d;
      color: #fff;
      padding: 0.9rem 1.6rem;
      border-radius: 50px 10px 50px 10px;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 8px 0 #7a1f1f, 0 15px 30px rgba(0,0,0,0.6);
      z-index: 999;
      transition: transform 0.25s cubic-bezier(.2,1.5,.5,1);
      border: 2px solid #ffb3b3;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      .card { padding: 1.2rem 0.8rem 2rem; }
      h1 { font-size: 1.7rem; }
      .token-value { font-size: 0.9rem; letter-spacing: 0.5px; }
      .token-value:empty::before { font-size: 1rem; letter-spacing: 3px; }
      .btn-generate { font-size: 1.1rem; padding: 0.7rem; }
      label { font-size: 0.88rem; }
      .progress-text { font-size: 0.75rem; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>⚔️ QUEST TOKEN ⚔️<br>GENERATOR</h1>
    <div class="subhead">🔮 answer 100+ dumb questions · all * required 🔮</div>

    <div class="progress-sticky">
      <span class="progress-text">📋 <span id="answeredCount">0</span> / <span id="totalCount">0</span> answered</span>
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="progressBar"></div>
      </div>
      <span class="progress-percent" id="progressPercent">0%</span>
    </div>

    <form id="trollForm" class="form-grid" onsubmit="return false;">
      <div class="section-divider">➕ MATHS (dumbed down) ➕</div>
      <!-- MATHS QUESTIONS 1-35 -->
      <!-- 1 -->
      <div class="field" data-qid="1">
        <label><span class="qnum">1.</span> 🐾 input your animal company IGN <span class="req-star">*</span></label>
        <input type="text" id="ign" placeholder="e.g. 'SirBarksALot'" data-required="true">
      </div>
      <!-- 2 -->
      <div class="field" data-qid="2">
        <label><span class="qnum">2.</span> ➕ what is 1 + 1? (careful, it's tricky) <span class="req-star">*</span></label>
        <input type="text" id="q2" placeholder="type a number... or a feeling" data-required="true">
      </div>
      <!-- 3 -->
      <div class="field" data-qid="3">
        <label><span class="qnum">3.</span> ➕ what is 2 + 2? (no calculators, please) <span class="req-star">*</span></label>
        <input type="text" id="q3" placeholder="e.g. '4', 'fish'" data-required="true">
      </div>
      <!-- 4 -->
      <div class="field" data-qid="4">
        <label><span class="qnum">4.</span> ➕ if you have 3 apples and eat 2, how many apples do you have? <span class="req-star">*</span></label>
        <input type="text" id="q4" placeholder="apples, regrets, whatever" data-required="true">
      </div>
      <!-- 5 -->
      <div class="field" data-qid="5">
        <label><span class="qnum">5.</span> ➕ what shape has 3 sides? (hint: it's a triangle, but act surprised) <span class="req-star">*</span></label>
        <input type="text" id="q5" placeholder="e.g. 'triangle', 'pizza slice'" data-required="true">
      </div>
      <!-- 6 -->
      <div class="field" data-qid="6">
        <label><span class="qnum">6.</span> ➕ how many sides does a square have? (it's not 5) <span class="req-star">*</span></label>
        <input type="text" id="q6" placeholder="square sides..." data-required="true">
      </div>
      <!-- 7 -->
      <div class="field" data-qid="7">
        <label><span class="qnum">7.</span> ➕ what is 10 - 5? (big brain time) <span class="req-star">*</span></label>
        <input type="text" id="q7" placeholder="numbers please" data-required="true">
      </div>
      <!-- 8 -->
      <div class="field" data-qid="8">
        <label><span class="qnum">8.</span> ➕ is 0 an even number? (yes or no, we don't judge) <span class="req-star">*</span></label>
        <select id="q8" data-required="true">
          <option value="" disabled selected>— pick one —</option>
          <option value="yes">yes (I think)</option>
          <option value="no">no (chaos)</option>
          <option value="maybe">maybe (existential)</option>
        </select>
      </div>
      <!-- 9 -->
      <div class="field" data-qid="9">
        <label><span class="qnum">9.</span> ➕ what is 5 × 2? (use your fingers if needed) <span class="req-star">*</span></label>
        <input type="text" id="q9" placeholder="multiply... carefully" data-required="true">
      </div>
      <!-- 10 -->
      <div class="field" data-qid="10">
        <label><span class="qnum">10.</span> ➕ if a pizza has 8 slices and you eat 8, how many are left? <span class="req-star">*</span></label>
        <input type="text" id="q10" placeholder="sadness" data-required="true">
      </div>
      <!-- 11 -->
      <div class="field" data-qid="11">
        <label><span class="qnum">11.</span> ➕ what comes after 9? (counting is hard) <span class="req-star">*</span></label>
        <input type="text" id="q11" placeholder="the next number..." data-required="true">
      </div>
      <!-- 12 -->
      <div class="field" data-qid="12">
        <label><span class="qnum">12.</span> ➕ how many legs does a dog have? (most of them) <span class="req-star">*</span></label>
        <input type="text" id="q12" placeholder="legs..." data-required="true">
      </div>
      <!-- 13 -->
      <div class="field" data-qid="13">
        <label><span class="qnum">13.</span> ➕ is 7 a prime number? (or just weird?) <span class="req-star">*</span></label>
        <select id="q13" data-required="true">
          <option value="" disabled selected>— pick one —</option>
          <option value="yes">yes</option>
          <option value="no">no</option>
          <option value="idk">idk what prime means</option>
        </select>
      </div>
      <!-- 14 -->
      <div class="field" data-qid="14">
        <label><span class="qnum">14.</span> ➕ what is half of 10? (not a trick, maybe) <span class="req-star">*</span></label>
        <input type="text" id="q14" placeholder="half..." data-required="true">
      </div>
      <!-- 15 -->
      <div class="field" data-qid="15">
        <label><span class="qnum">15.</span> ➕ how many seconds in a minute? (roughly) <span class="req-star">*</span></label>
        <input type="text" id="q15" placeholder="seconds..." data-required="true">
      </div>
      <!-- 16 -->
      <div class="field" data-qid="16">
        <label><span class="qnum">16.</span> ➕ what is 100 - 1? (don't overthink) <span class="req-star">*</span></label>
        <input type="text" id="q16" placeholder="almost 100" data-required="true">
      </div>
      <!-- 17 -->
      <div class="field" data-qid="17">
        <label><span class="qnum">17.</span> ➕ if you have 2 cats and get 2 more, how many cats? <span class="req-star">*</span></label>
        <input type="text" id="q17" placeholder="cat math" data-required="true">
      </div>
      <!-- 18 -->
      <div class="field" data-qid="18">
        <label><span class="qnum">18.</span> ➕ what's bigger: 5 or 3? (choose wisely) <span class="req-star">*</span></label>
        <select id="q18" data-required="true">
          <option value="" disabled selected>— pick —</option>
          <option value="5">5</option>
          <option value="3">3</option>
          <option value="equal">they're the same (wrong)</option>
        </select>
      </div>
      <!-- 19 -->
      <div class="field" data-qid="19">
        <label><span class="qnum">19.</span> ➕ how many wheels does a bicycle have? <span class="req-star">*</span></label>
        <input type="text" id="q19" placeholder="wheels..." data-required="true">
      </div>
      <!-- 20 -->
      <div class="field" data-qid="20">
        <label><span class="qnum">20.</span> ➕ what is 3 × 3? (the answer is 9 but pretend you're thinking) <span class="req-star">*</span></label>
        <input type="text" id="q20" placeholder="times tables" data-required="true">
      </div>

      <div class="section-divider">📖 ENGLISH (dumbed down) 📖</div>
      <!-- ENGLISH 21-50 -->
      <div class="field" data-qid="21">
        <label><span class="qnum">21.</span> 📖 what letter comes after A? (the alphabet is hard) <span class="req-star">*</span></label>
        <input type="text" id="q21" placeholder="one letter" data-required="true">
      </div>
      <div class="field" data-qid="22">
        <label><span class="qnum">22.</span> 📖 how many letters are in the word "cat"? <span class="req-star">*</span></label>
        <input type="text" id="q22" placeholder="count them" data-required="true">
      </div>
      <div class="field" data-qid="23">
        <label><span class="qnum">23.</span> 📖 is "dog" a noun or a verb? (no pressure) <span class="req-star">*</span></label>
        <select id="q23" data-required="true">
          <option value="" disabled selected>— choose —</option>
          <option value="noun">noun</option>
          <option value="verb">verb</option>
          <option value="both">both (chaos answer)</option>
        </select>
      </div>
      <div class="field" data-qid="24">
        <label><span class="qnum">24.</span> 📖 what is the plural of "mouse"? (not mouses) <span class="req-star">*</span></label>
        <input type="text" id="q24" placeholder="plural mouse" data-required="true">
      </div>
      <div class="field" data-qid="25">
        <label><span class="qnum">25.</span> 📖 spell the word "fish" backwards <span class="req-star">*</span></label>
        <input type="text" id="q25" placeholder="backwards fish" data-required="true">
      </div>
      <div class="field" data-qid="26">
        <label><span class="qnum">26.</span> 📖 what is the opposite of "hot"? (ice cold) <span class="req-star">*</span></label>
        <input type="text" id="q26" placeholder="opposite of hot" data-required="true">
      </div>
      <div class="field" data-qid="27">
        <label><span class="qnum">27.</span> 📖 how many syllables in "banana"? (ba-na-na) <span class="req-star">*</span></label>
        <input type="text" id="q27" placeholder="syllables" data-required="true">
      </div>
      <div class="field" data-qid="28">
        <label><span class="qnum">28.</span> 📖 does "orange" rhyme with anything? (be honest) <span class="req-star">*</span></label>
        <select id="q28" data-required="true">
          <option value="" disabled selected>— pick —</option>
          <option value="yes">yes (door hinge)</option>
          <option value="no">no (sad)</option>
          <option value="maybe">maybe (philosophical)</option>
        </select>
      </div>
      <div class="field" data-qid="29">
        <label><span class="qnum">29.</span> 📖 what punctuation mark ends a question? <span class="req-star">*</span></label>
        <input type="text" id="q29" placeholder="punctuation..." data-required="true">
      </div>
      <div class="field" data-qid="30">
        <label><span class="qnum">30.</span> 📖 is "run" a verb? (yes, but confirm) <span class="req-star">*</span></label>
        <select id="q30" data-required="true">
          <option value="" disabled selected>— choose —</option>
          <option value="yes">yes</option>
          <option value="no">no</option>
          <option value="sometimes">sometimes</option>
        </select>
      </div>
      <div class="field" data-qid="31">
        <label><span class="qnum">31.</span> 📖 what is the first letter of the word "apple"? <span class="req-star">*</span></label>
        <input type="text" id="q31" placeholder="one letter" data-required="true">
      </div>
      <div class="field" data-qid="32">
        <label><span class="qnum">32.</span> 📖 how many words are in "I like cheese"? <span class="req-star">*</span></label>
        <input type="text" id="q32" placeholder="count words" data-required="true">
      </div>
      <div class="field" data-qid="33">
        <label><span class="qnum">33.</span> 📖 is "happy" a positive or negative word? <span class="req-star">*</span></label>
        <select id="q33" data-required="true">
          <option value="" disabled selected>— pick —</option>
          <option value="positive">positive</option>
          <option value="negative">negative</option>
          <option value="neutral">neutral (weird)</option>
        </select>
      </div>
      <div class="field" data-qid="34">
        <label><span class="qnum">34.</span> 📖 what does "onomatopoeia" mean? (just guess) <span class="req-star">*</span></label>
        <input type="text" id="q34" placeholder="sound words..." data-required="true">
      </div>
      <div class="field" data-qid="35">
        <label><span class="qnum">35.</span> 📖 what is the capital of England? (English question) <span class="req-star">*</span></label>
        <input type="text" id="q35" placeholder="city name" data-required="true">
      </div>
      <div class="field" data-qid="36">
        <label><span class="qnum">36.</span> 📖 spell "dog" <span class="req-star">*</span></label>
        <input type="text" id="q36" placeholder="d-o-g" data-required="true">
      </div>
      <div class="field" data-qid="37">
        <label><span class="qnum">37.</span> 📖 what is a synonym for "big"? <span class="req-star">*</span></label>
        <input type="text" id="q37" placeholder="big synonym" data-required="true">
      </div>
      <div class="field" data-qid="38">
        <label><span class="qnum">38.</span> 📖 how many letters in the alphabet? (roughly) <span class="req-star">*</span></label>
        <input type="text" id="q38" placeholder="letters" data-required="true">
      </div>
      <div class="field" data-qid="39">
        <label><span class="qnum">39.</span> 📖 is "the" a word? (yes, but confirm) <span class="req-star">*</span></label>
        <select id="q39" data-required="true">
          <option value="" disabled selected>— choose —</option>
          <option value="yes">yes</option>
          <option value="no">no</option>
          <option value="maybe">maybe</option>
        </select>

  <div class="toast" id="toast"></div>

  <script>
    (function() {
      const form = document.getElementById('trollForm');
      const generateBtn = document.getElementById('generateBtn');
      const tokenValue = document.getElementById('tokenValue');
      const toast = document.getElementById('toast');

      // Gather all required fields dynamically
      const requiredFields = [];
      document.querySelectorAll('[data-required="true"]').forEach(el => {
        requiredFields.push(el);
      });

      const totalRequired = requiredFields.length;
      document.getElementById('totalCount').textContent = totalRequired;

      // Helper: generate random 64-char string
      function generateRandom64() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%&?';
        let result = '';
        for (let i = 0; i < 64; i++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
      }

      // Check if a field is filled
      function isFilled(el) {
        if (el.tagName === 'SELECT') {
          return el.value !== '' && el.value !== null;
        }
        return el.value.trim() !== '';
      }

      // Update progress bar and field styling
      function updateProgress() {
        let answered = 0;
        requiredFields.forEach(el => {
          const fieldDiv = el.closest('.field');
          if (isFilled(el)) {
            answered++;
            if (fieldDiv) {
              fieldDiv.classList.add('done');
              fieldDiv.classList.remove('missing');
            }
            el.classList.remove('invalid');
          } else {
            if (fieldDiv) {
              fieldDiv.classList.remove('done');
            }
          }
        });

        const percent = Math.round((answered / totalRequired) * 100);
        document.getElementById('answeredCount').textContent = answered;
        document.getElementById('progressBar').style.width = percent + '%';
        document.getElementById('progressPercent').textContent = percent + '%';
      }

      // Show toast
      let toastTimer;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('show');
        }, 2600);
      }

      // Validate all required fields
      function validateAll() {
        const missing = [];
        requiredFields.forEach(el => {
          if (!isFilled(el)) {
            missing.push(el);
            el.classList.add('invalid');
            const fieldDiv = el.closest('.field');
            if (fieldDiv) fieldDiv.classList.add('missing');
          } else {
            el.classList.remove('invalid');
          }
        });

        if (missing.length > 0) {
          const first = missing[0];
          const labelText = first.closest('.field')?.querySelector('label')?.textContent?.trim().slice(0, 60) || 'a required field';
          showToast(`❌ ${missing.length} question(s) still empty! (e.g. "${labelText}...")`);
          first.scrollIntoView({ behavior: 'smooth', block: 'center' });
          first.focus();
          return false;
        }
        return true;
      }

      // Generate & display token
      function generateTokenAndDisplay() {
        const token = generateRandom64();
        tokenValue.textContent = token;
        tokenValue.classList.add('glitch');
        setTimeout(() => tokenValue.classList.remove('glitch'), 250);
        document.getElementById('tokenOutput').scrollIntoView({ behavior: 'smooth', block: 'center' });
        showToast('✅ Token generated! (100% real, trust)');
      }

      // Main handler
      generateBtn.addEventListener('click', function(e) {
        e.preventDefault();
        if (!validateAll()) return;
        generateTokenAndDisplay();
      });

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        generateBtn.click();
      });

      form.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
          e.preventDefault();
          generateBtn.click();
        }
      });

      // Live progress updates
      requiredFields.forEach(el => {
        el.addEventListener('input', updateProgress);
        el.addEventListener('change', updateProgress);
      });

      // Initial update
      updateProgress();
    })();
  </script>
</body>
</html>
